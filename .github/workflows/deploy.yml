# Push to main: test, then deploy aira-live (Cloud Run, asia-south1) and the aira-shop Hosting site.
# Keyless auth through Workload Identity Federation; the provider only accepts this repo's main branch.
# Repository secrets: GCP_PROJECT, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, VITE_FIREBASE_*.
# Until services/live and apps/app land, the bootstrap in infra/sample is deployed in their place.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGION: asia-south1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Tests are skipped only while the code they cover does not exist yet. Once a workspace or
      # services/live exists, a missing lockfile or a failing test stops the deploy.
      - name: Use Node 22
        if: hashFiles('apps/*/package.json', 'packages/*/package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: TypeScript workspaces
        if: hashFiles('apps/*/package.json', 'packages/*/package.json') != ''
        run: npm ci && npm test

      - name: Use uv
        if: hashFiles('services/live/pyproject.toml') != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: services/live/uv.lock

      - name: services/live
        if: hashFiles('services/live/pyproject.toml') != ''
        working-directory: services/live
        run: uv sync --frozen && uv run pytest -q

  deploy:
    name: Deploy
    needs: test
    if: github.repository == 'Saravana-Rajan/AIRA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build and push the aira-live image
        id: image
        run: |
          context=services/live
          [ -f "$context/Dockerfile" ] || context=infra/sample/live
          image="$REGION-docker.pkg.dev/$GCP_PROJECT/aira/aira-live:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$image" "$context"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # --update-* (not --set-*) so env vars and secrets added on the service later, such as the
      # WhatsApp tokens, survive every deploy. Public access was granted once on the service and
      # carries over to new revisions; the deployer only holds run.developer on aira-live.
      - name: Deploy aira-live (Cloud Run)
        run: |
          gcloud run deploy aira-live \
            --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" \
            --project "$GCP_PROJECT" \
            --service-account "aira-live@$GCP_PROJECT.iam.gserviceaccount.com" \
            --min-instances 1 \
            --max-instances 1 \
            --timeout 3600 \
            --session-affinity \
            --update-secrets GEMINI_API_KEY=aira-gemini-api-key:latest,AIRA_JOB_TOKEN=aira-job-token:latest,WHATSAPP_VERIFY_TOKEN=aira-whatsapp-verify-token:latest \
            --update-env-vars "FIRESTORE_DATABASE=aira,AIRA_DEMO_SHOP=murugan_dairy,AIRA_ALLOW_NO_TOKEN=1,AIRA_MOCK=0,GCP_PROJECT=$GCP_PROJECT" \
            --quiet

      - name: Read the aira-live URL
        id: live
        run: |
          url="$(gcloud run services describe aira-live --region "$REGION" --project "$GCP_PROJECT" --format='value(status.url)')"
          test -n "$url"
          echo "http=$url" >> "$GITHUB_OUTPUT"
          echo "ws=wss://${url#https://}/ws" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build the hosting bundle
        env:
          AIRA_LIVE_HTTP: ${{ steps.live.outputs.http }}
          VITE_AIRA_LIVE_WS: ${{ steps.live.outputs.ws }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          if [ -f apps/app/package.json ]; then
            bash scripts/build_hosting.sh
          else
            rm -rf dist/hosting
            mkdir -p dist/hosting
            sed "s#__AIRA_LIVE_HTTP__#$AIRA_LIVE_HTTP#g" infra/sample/hosting/index.html > dist/hosting/index.html
            cp assets/logo/aira-logo-192.png dist/hosting/
          fi

      - name: Deploy hosting (aira-shop)
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting:aira-shop --project "$GCP_PROJECT" --non-interactive
