[project]
name = "aira-live"
version = "0.1.0"
description = "AIRA live voice + vision service (Cloud Run aira-live)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.11",
  "google-genai>=1.0",
  "google-adk>=1.0",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "jsonschema>=4.23",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
# tests/ mirrors the package (tests/core, tests/tools, tests/business, ...) without __init__.py files,
# so two folders may hold a test file with the same name (e.g. test_sales.py).
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aira_live"]
